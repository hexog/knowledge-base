name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore KnowledgeBase.slnx
      - run: dotnet build KnowledgeBase.slnx --no-restore --configuration Release
      - run: dotnet test KnowledgeBase.slnx --no-build --configuration Release
